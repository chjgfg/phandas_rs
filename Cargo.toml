[package]
name = "phandas_rs"
version = "0.1.0"
edition = "2021"
# `Option::is_none_or`（src/factor/panel.rs:214）在 1.82 稳定；`std::iter::repeat_n`
# （src/factor/ts.rs）同样是 1.82 稳定，两者共同决定当前 MSRV 下限。
# 注意：本机仅有 stable 1.92，未用 1.82 工具链实际验证过。
# rust-version = "1.82"
authors = ["GG-lyf <2083298549@qq.com>"]
description = "Alpha factor construction, factor evaluation and event-driven backtesting on dense panel data: 70+ cross-sectional and time-series operators, cross-sectional IC with IR/t-stat, factor correlation and coverage/turnover/autocorr stats, portfolio simulation with transaction costs, 11 performance metrics. Zero dependencies by default; optional Binance market-data fetching. Rust port of Python phandas."
readme = "README.md"
repository = "https://github.com/GG-lyf/phandas_rs"
documentation = "https://docs.rs/phandas_rs"
license = "MIT"
keywords = ["quant", "alpha", "factor", "panel-data", "backtesting"]
categories = ["finance", "mathematics", "science"]

# 白名单：只有列出的路径会进入 .crate 包。
# 用 include 而不是 exclude，是因为仓库里有 .omc/ 这类本地脚本目录，
# 用 exclude 容易漏掉而把本地文件发布上去。
# /tests 一并收录：测试已全部搬到那里，不带上发布包就无法自验。
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
]

[lib]
name = "phandas_rs"
path = "src/lib.rs"

# src/main.rs 是演示程序，不是这个包的主要用途。
# 显式命名以免 `cargo install phandas_rs` 装出一个叫 phandas_rs 的样例二进制。
[[bin]]
name = "phandas-demo"
path = "src/main.rs"

# examples/pipeline.rs 演示「抓数 → 造因子 → 评价 → 回测 → 实盘」整条流水线，
# 前四步要 data、第五步要 trader。声明 required-features，免得默认构建时它编不过。
[[example]]
name = "pipeline"
required-features = ["data"]

# 默认零依赖：分位数反函数、最小二乘、条件数估计、CSV 解析都在 src/factor/ 内实现。
# 联网的两个模块放在可选 feature 后面——`cargo build` 不开 feature 时依赖表仍然是空的。
# 日后引入 rayon 之类的并行后端时同样照此处理，别破坏零依赖这个卖点。
[features]
default = []
# Binance 行情抓取（src/data/）
data = ["_net"]
# OKX 永续下单（src/trader/），多签名要用的三件套
trader = ["_net", "dep:hmac", "dep:sha2", "dep:base64"]
# 内部 feature：data 与 trader 共用的 HTTP + JSON 底座（src/net/）
_net = ["dep:reqwest", "dep:serde_json", "dep:tokio"]

# 只在开 data / trader 时才会被拉进来。
# 注意：reqwest 0.13 的 MSRV 是 1.85，高于默认构建的 1.82——开了这两个 feature 的 MSRV 随之抬到 1.85。
# system-proxy 保留：交易所端点常需走代理，reqwest 据此读 HTTPS_PROXY / HTTP_PROXY。
# tokio 只要 time：分页之间要按限频节流。reqwest 的异步客户端本身就要求 tokio 运行时，
# 所以显式依赖它并不会多引入任何约束，只是让 sleep 用得上。
[dependencies]
reqwest = { version = "0.13", optional = true, default-features = false, features = [
    "rustls",
    "http2",
    "system-proxy",
] }
serde_json = { version = "1", optional = true }
tokio = { version = "1", optional = true, default-features = false, features = ["time"] }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }

# tokio 的 macros / rt 只作开发依赖：库里的 async fn 由调用方的运行时驱动，
# 不替调用方选运行时。这份多出来的两个 feature 只服务 #[tokio::test]。
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# 仅在 phandas_rs 作为根 crate 构建时生效（被别人当依赖时会被忽略）。
# 主要服务 `cargo run --example smoke --release` 里的耗时测量。
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# [lints.rust]
# # 全 crate 无 unsafe，用 forbid 把这一点固定下来。
# unsafe_code = "forbid"
